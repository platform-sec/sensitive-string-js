name: CodeQL Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Run extended query suite for security-critical code
          queries: +security-extended,security-and-quality
          # Custom queries for sensitive data handling
          config: |
            paths-ignore:
              - '**/node_modules'
              - '**/dist'
              - '**/*.test.ts'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          # Upload SARIF results even if analysis fails (skip in act - local runner)
          upload: ${{ !env.ACT }}
          # Generate detailed security report
          output: sarif-results

      - name: Upload CodeQL results as artifact
        uses: actions/upload-artifact@v4
        # Skip in act (local runner) - artifact upload requires GitHub infrastructure
        if: ${{ always() && !env.ACT }}
        continue-on-error: true
        with:
          name: codeql-results
          path: sarif-results
          retention-days: 30
