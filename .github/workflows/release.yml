name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, sign, and verify without publishing'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release consistency
        run: pnpm release:check -- --require-no-changesets

      - name: Require main for publication
        if: ${{ inputs.dry_run == false && github.ref != 'refs/heads/main' }}
        run: |
          echo 'A real release must be dispatched from main.' >&2
          exit 1

      - name: Build packages
        run: pnpm build

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check packages and examples
        run: pnpm typecheck

      - name: Type-check NestJS package
        run: pnpm --filter @platform-sec/sensitive-string-nestjs exec tsc --noEmit

      - name: Run tests
        run: pnpm test

      - name: Check packed entry points
        run: pnpm check:packaging

      - name: Run security audit
        run: pnpm audit --audit-level=high

  prepare:
    name: Plan and pack committed versions
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Create publish plan
        run: |
          # Every committed version npm lacks, then only the allowlisted ones.
          # release:check refuses a plan entry that is not allowlisted, so the
          # filter is not the only thing keeping a held package off npm.
          pnpm changeset publish-plan --output publish-plan.full.json
          pnpm release:filter -- \
            --plan publish-plan.full.json \
            --output publish-plan.json \
            --held held-releases.txt
          pnpm release:check -- \
            --plan publish-plan.json \
            --require-releases \
            --require-no-changesets

      - name: Pack exact release artifacts
        run: |
          pnpm release:pack -- \
            --plan publish-plan.json \
            --out-dir release-bundle
          pnpm release:check -- \
            --plan release-bundle/publish-plan.json \
            --require-releases \
            --require-tarballs

      - name: Record artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-bundle/packages
          shopt -s nullglob
          tarballs=(*.tgz)
          if (( ${#tarballs[@]} > 0 )); then
            sha256sum -- "${tarballs[@]}" > SHA256SUMS
          else
            : > SHA256SUMS
          fi

      - name: Summarize plan
        run: |
          {
            echo '## Release plan'
            echo
            jq -r \
              '.plan | flatten | .[] | "- **\(.name)** \(.version) (kind \(.kind), tag \(.tag))"' \
              release-bundle/publish-plan.json
            echo
            echo '## Held by release-allowlist.json'
            echo
            if [[ -s held-releases.txt ]]; then
              sed 's/^/- /' held-releases.txt
            else
              echo '- none'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ github.sha }}
          path: release-bundle
          retention-days: 7
          if-no-files-found: error

  sign:
    name: Sign exact tarballs
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ github.sha }}
          path: release-bundle

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign packages with keyless Cosign
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(release-bundle/packages/*.tgz)
          for tarball in "${tarballs[@]}"; do
            cosign sign-blob \
              --yes \
              --output-signature "${tarball}.sig" \
              --output-certificate "${tarball}.pem" \
              "$tarball"
          done

      - name: Verify signatures
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(release-bundle/packages/*.tgz)
          for tarball in "${tarballs[@]}"; do
            cosign verify-blob \
              --signature "${tarball}.sig" \
              --certificate "${tarball}.pem" \
              --certificate-identity-regexp \
                '^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/(heads|tags)/.+$' \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$tarball"
          done

      - name: Upload signed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-bundle-${{ github.sha }}
          path: release-bundle
          retention-days: 90
          if-no-files-found: error

  publish:
    name: Publish signed tarballs
    runs-on: ubuntu-latest
    needs: [prepare, sign]
    if: ${{ github.ref == 'refs/heads/main' && inputs.dry_run == false }}
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download signed release bundle
        uses: actions/download-artifact@v4
        with:
          name: signed-release-bundle-${{ github.sha }}
          path: signed-release-bundle

      - name: Check signed bundle
        run: |
          pnpm release:check -- \
            --plan signed-release-bundle/publish-plan.json \
            --require-releases \
            --require-tarballs

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Verify downloaded signatures
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(signed-release-bundle/packages/*.tgz)
          for tarball in "${tarballs[@]}"; do
            cosign verify-blob \
              --signature "${tarball}.sig" \
              --certificate "${tarball}.pem" \
              --certificate-identity-regexp \
                '^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/(heads|tags)/.+$' \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$tarball"
          done

      - name: Publish and push package tags
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --local credential.https://github.com.helper \
            '!gh auth git-credential'
          trap 'git config --local --unset-all credential.https://github.com.helper || true' EXIT

          pnpm changeset publish --from-pack-dir signed-release-bundle

          while IFS= read -r tag; do
            git rev-parse --verify "refs/tags/$tag" >/dev/null
            git push origin "refs/tags/$tag"
          done < <(
            jq -r '.plan | flatten | .[] | "\(.name)@\(.version)"' \
              signed-release-bundle/publish-plan.json
          )

      - name: Summarize publication
        run: |
          {
            echo '## Published packages'
            echo
            jq -r \
              '.plan | flatten | .[] | "- **\(.name)** \(.version)"' \
              signed-release-bundle/publish-plan.json
            echo
            echo '- npm provenance: enabled'
            echo '- Cosign signatures: verified before publication'
          } >> "$GITHUB_STEP_SUMMARY"

  create-release:
    name: Create batch release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download signed release bundle
        uses: actions/download-artifact@v4
        with:
          name: signed-release-bundle-${{ github.sha }}
          path: signed-release-bundle

      - name: Create or repair GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          release_tag="release-${GITHUB_RUN_ID}"
          {
            echo '# Package releases'
            echo
            echo "This batch publishes independently versioned packages from commit $GITHUB_SHA."
          } > release-notes.md

          # jq and awk use their own $name and $0 variables in literal programs.
          # shellcheck disable=SC2016
          while IFS=$'\t' read -r name version; do
            manifest=$(
              find packages -mindepth 2 -maxdepth 2 -name package.json -print0 |
                xargs -0 jq -r --arg name "$name" \
                  'select(.name == $name) | input_filename'
            )
            changelog="${manifest%/package.json}/CHANGELOG.md"

            {
              echo
              echo "## $name@$version"
              echo
            } >> release-notes.md
            awk -v heading="## $version" '
              $0 == heading { printing = 1; next }
              printing && /^## / && $0 != heading { exit }
              printing { print }
            ' "$changelog" >> release-notes.md
          done < <(
            jq -r '
              .plan
              | flatten
              | .[]
              | [.name, .version]
              | @tsv
            ' signed-release-bundle/publish-plan.json
          )

          shopt -s nullglob
          assets=(
            signed-release-bundle/packages/*.tgz
            signed-release-bundle/packages/*.tgz.sig
            signed-release-bundle/packages/*.tgz.pem
            signed-release-bundle/packages/SHA256SUMS
          )

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" \
              --title "$release_tag" \
              --notes-file release-notes.md
            gh release upload "$release_tag" "${assets[@]}" --clobber
          else
            gh release create "$release_tag" \
              --target "$GITHUB_SHA" \
              --title "$release_tag" \
              --notes-file release-notes.md \
              "${assets[@]}"
          fi

  dry-run-summary:
    name: Dry-run summary
    runs-on: ubuntu-latest
    needs: [prepare, sign]
    if: ${{ inputs.dry_run == true }}
    permissions:
      contents: read
    steps:
      - name: Download signed release bundle
        uses: actions/download-artifact@v4
        with:
          name: signed-release-bundle-${{ github.sha }}
          path: signed-release-bundle

      - name: Summarize dry run
        run: |
          {
            echo '## Dry run complete'
            echo
            echo 'No package or tag was published.'
            echo
            jq -r \
              '.plan | flatten | .[] | "- **\(.name)** \(.version) (kind \(.kind))"' \
              signed-release-bundle/publish-plan.json
            echo
            echo 'The exact signed bundle is available as a workflow artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
