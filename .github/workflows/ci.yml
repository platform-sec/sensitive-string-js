name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly, against the newest Node 22 and 24 rather than the pins in .nvmrc
  # and NODE_24, so a Node release, a new advisory or a client release fails
  # here first, on a run nobody is waiting on, instead of on the next push.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Node 24 the test matrix pins on push and pull request. Node 22 is pinned
  # in .nvmrc, which the local toolchain and `pnpm verify` read too.
  NODE_24: '24.22.2'

jobs:
  workflow-security:
    name: Workflow Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          fail-on-error: true

      - name: Install zizmor
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -LsSf https://github.com/woodruffw/zizmor/releases/latest/download/zizmor-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/zizmor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run zizmor
        run: zizmor --format sarif . > zizmor-results.sarif

      - name: Upload zizmor SARIF
        uses: github/codeql-action/upload-sarif@v3
        # Skip in act (local runner) - SARIF upload requires GitHub infrastructure
        if: ${{ always() && !env.ACT }}
        continue-on-error: true
        with:
          sarif_file: zizmor-results.sarif
          category: zizmor

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # The .nvmrc pin, except on the nightly run, which takes the newest 22.
          node-version: ${{ github.event_name == 'schedule' && '22' || '' }}
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # Compiles every package plus its tests under one program. This is what
      # runs the type-level seam checks, which fail when a vendor SDK adds or
      # removes a hook that an integration package claims to cover.
      - name: Type-check
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # The .nvmrc pin, except on the nightly run, which takes the newest 22.
          node-version: ${{ github.event_name == 'schedule' && '22' || '' }}
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Check package manifests
        run: pnpm check:packaging

      - name: Check release consistency and allowlist
        run: pnpm release:check

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: dist
          path: packages/*/dist
          retention-days: 1

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned on push and pull request (22 from .nvmrc, 24 from NODE_24),
          # the newest of each line on the nightly run.
          node-version: ${{ github.event_name == 'schedule' && matrix.node-version || matrix.node-version == '24' && env.NODE_24 || '' }}
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      # Wall clock measurements. Informational: a shared runner's scheduling
      # decides the verdict, so this reports and never gates.
      - name: Run timing analysis
        run: pnpm test:timing
        continue-on-error: true

  vault-compat:
    name: Vault compatibility (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A fork diverges, and a compatibility claim made once is a claim that
    # rots. The unit suite proves the package reads what it believes the server
    # sends; this job proves that is what the server sends. Informational: a
    # container image moving is not a reason to block a merge, and the table it
    # feeds records versions rather than gating on them.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: vault
            image: hashicorp/vault:latest
          - flavor: openbao
            image: openbao/openbao:latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # The .nvmrc pin, except on the nightly run, which takes the newest 22.
          node-version: ${{ github.event_name == 'schedule' && '22' || '' }}
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # Started with `docker run` rather than as a service container, because
      # both images need dev-mode arguments and a service container cannot
      # supply a command.
      - name: Start ${{ matrix.flavor }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run -d --name secret-server -p 8200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID=root \
            -e BAO_DEV_ROOT_TOKEN_ID=root \
            --cap-add=IPC_LOCK "$IMAGE"

          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8200/v1/sys/health > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -s http://127.0.0.1:8200/v1/sys/health | head -c 400
          echo

      - name: Run the live suite
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: root
          VAULT_FLAVOR: ${{ matrix.flavor }}
        run: pnpm vitest run packages/sensitive-vault/src/__tests__/live.test.ts

      - name: Stop ${{ matrix.flavor }}
        if: always()
        run: docker rm -f secret-server || true

  secrets-live:
    name: Secrets provider live tier (${{ matrix.provider }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The unit suites run against fixtures, and a fixture is only as good as the
    # recording behind it. This job is what keeps the fixtures honest for the
    # three providers that can be stood up without a cloud account. It has
    # already earned itself twice: the Kubernetes annotation turned out to hold
    # plaintext rather than base64, and the sops absence check was matching on
    # wording the stand-in binary invented. Informational for the same reason
    # `vault-compat` is: an image or a release moving is not a reason to block a
    # merge.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        provider: [k8s, sops, aws]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # The .nvmrc pin, except on the nightly run, which takes the newest 22.
          node-version: ${{ github.event_name == 'schedule' && '22' || '' }}
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # k3s needs `--privileged` and a command, so it is started with
      # `docker run` rather than as a service container, the same reason the
      # Vault job gives.
      - name: Start k3s
        if: matrix.provider == 'k8s'
        run: |
          mkdir -p "$RUNNER_TEMP/k3s"
          chmod 777 "$RUNNER_TEMP/k3s"
          docker run -d --privileged --name k3s -p 6443:6443 \
            -e K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml \
            -e K3S_KUBECONFIG_MODE=666 \
            -v "$RUNNER_TEMP/k3s:/output" \
            rancher/k3s:latest server --disable traefik --disable metrics-server --disable servicelb

          for _ in $(seq 1 90); do
            if docker exec k3s kubectl get nodes 2>/dev/null | grep -q Ready; then
              break
            fi
            sleep 2
          done

          docker exec k3s kubectl version --output=json | head -c 400
          echo

      - name: Create the Secrets the live suite reads
        if: matrix.provider == 'k8s'
        env:
          CANARY: LEAKED_SECRET_abc123xyz
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/k3s/tls.key" -out "$RUNNER_TEMP/k3s/tls.crt" \
            -subj '/CN=example.internal'
          docker cp "$RUNNER_TEMP/k3s/tls.key" k3s:/tmp/tls.key
          docker cp "$RUNNER_TEMP/k3s/tls.crt" k3s:/tmp/tls.crt

          docker exec k3s kubectl create namespace payments

          # Applied rather than created, because `kubectl apply` is what writes
          # the last-applied-configuration annotation the suite asserts on, and
          # `stringData` is what puts the secret in that annotation unencoded.
          printf '%s\n' \
            'apiVersion: v1' \
            'kind: Secret' \
            'metadata:' \
            '  name: db-creds' \
            '  namespace: payments' \
            'type: Opaque' \
            'stringData:' \
            '  username: app' \
            "  password: $CANARY" \
            > "$RUNNER_TEMP/k3s/db-creds.yaml"
          docker cp "$RUNNER_TEMP/k3s/db-creds.yaml" k3s:/tmp/db-creds.yaml
          docker exec k3s kubectl apply -f /tmp/db-creds.yaml

          docker exec k3s kubectl -n payments create secret generic opaque-creds \
            --from-literal=username=app --from-literal="password=$CANARY"
          docker exec k3s kubectl -n payments create secret generic basic-auth \
            --type=kubernetes.io/basic-auth \
            --from-literal=username=app --from-literal="password=$CANARY"
          docker exec k3s kubectl -n payments create secret generic regcred \
            --type=kubernetes.io/dockerconfigjson \
            --from-literal=".dockerconfigjson={\"auths\":{\"index.docker.io\":{\"username\":\"app\",\"password\":\"$CANARY\",\"auth\":\"YXBwOkxFQUtFRA==\"}}}"
          docker exec k3s kubectl -n payments create secret tls ingress-tls \
            --cert=/tmp/tls.crt --key=/tmp/tls.key

      - name: Run the Kubernetes live suite
        if: matrix.provider == 'k8s'
        env:
          K8S_KUBECONFIG: ${{ runner.temp }}/k3s/kubeconfig.yaml
          K8S_NAMESPACE: payments
        run: pnpm vitest run packages/sensitive-k8s/src/__tests__/live.test.ts

      - name: Stop k3s
        if: always() && matrix.provider == 'k8s'
        run: docker rm -f k3s || true

      - name: Install the sops binary
        if: matrix.provider == 'sops'
        run: |
          version=$(curl -sfL https://api.github.com/repos/getsops/sops/releases/latest \
            | grep -o '"tag_name": *"[^"]*"' | head -1 | cut -d'"' -f4)
          curl -sfL -o "$RUNNER_TEMP/sops" \
            "https://github.com/getsops/sops/releases/download/${version}/sops-${version}.linux.amd64"
          chmod +x "$RUNNER_TEMP/sops"
          "$RUNNER_TEMP/sops" --version --disable-version-check

      - name: Run the SOPS live suite
        if: matrix.provider == 'sops'
        env:
          SOPS_BINARY: ${{ runner.temp }}/sops
        run: pnpm vitest run packages/sensitive-sops/src/__tests__/live.test.ts

      # An emulator rather than AWS, so what this tier proves is the client-side
      # half: the command construction, the version routing and the exception
      # name are the SDK's rather than this package's guesses about them.
      - name: Start the Secrets Manager emulator
        if: matrix.provider == 'aws'
        run: |
          docker run -d --name localstack -p 4566:4566 -e SERVICES=secretsmanager \
            localstack/localstack:3.8

          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4566/_localstack/health | grep -q secretsmanager; then
              break
            fi
            sleep 2
          done

      - name: Run the AWS live suite
        if: matrix.provider == 'aws'
        env:
          AWS_SECRETS_ENDPOINT: http://127.0.0.1:4566
          AWS_REGION: us-east-1
        run: pnpm vitest run packages/sensitive-aws-secrets/src/__tests__/live.test.ts

      - name: Stop the emulator
        if: always() && matrix.provider == 'aws'
        run: docker rm -f localstack || true

  http-client-compat:
    name: HTTP client compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The HTTP client wrappers are built on measurements of what axios, got, ky
    # and undici actually do with a revealed credential: which properties a
    # rejection keeps it in, which ones a 200 keeps it in, and which headers
    # survive a cross-origin redirect. Those suites assert the bare client's
    # behaviour first and the wrapper's second, so they are regression tests
    # against the clients as much as against this repository.
    #
    # The lockfile pins the versions the measurements were taken on. This job
    # runs the same suites against whatever a user installing today would get,
    # so a client release that changes a measured row is visible here rather
    # than in a bug report. Informational for the same reason `vault-compat`
    # is: an upstream release moving is not a reason to block a merge.
    continue-on-error: true
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # The .nvmrc pin, except on the nightly run, which takes the newest 22.
          node-version: ${{ github.event_name == 'schedule' && '22' || '' }}
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Deliberately after the frozen install, and deliberately allowed to
      # rewrite the manifests: the checkout is thrown away, and the point is to
      # test against a resolution the lockfile does not describe.
      - name: Install the latest client releases
        run: |
          pnpm --filter @platform-sec/sensitive-string-axios add -D axios@latest
          pnpm --filter @platform-sec/sensitive-string-got add -D got@latest
          pnpm --filter @platform-sec/sensitive-string-ky add -D ky@latest
          pnpm --filter @platform-sec/sensitive-string-undici add -D undici@latest

      - name: Build packages
        run: pnpm build

      - name: Run the HTTP client suites
        run: |
          pnpm vitest run \
            packages/sensitive-http \
            packages/sensitive-axios \
            packages/sensitive-got \
            packages/sensitive-ky \
            packages/sensitive-fetch \
            packages/sensitive-undici

      # Recorded rather than gated on, so the row's measurement tables can say
      # which versions they last held for.
      - name: Record the versions this ran against
        if: always()
        run: |
          {
            echo "## HTTP client versions tested"
            echo ""
            echo "| Client | Version |"
            echo "|--------|---------|"
            for client in axios got ky undici; do
              version=$(node -p "require('./node_modules/$client/package.json').version" 2>/dev/null || echo 'not resolved')
              echo "| $client | $version |"
            done
            echo "| node | $(node --version) |"
          } >> "$GITHUB_STEP_SUMMARY"

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # The .nvmrc pin, except on the nightly run, which takes the newest 22.
          node-version: ${{ github.event_name == 'schedule' && '22' || '' }}
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        continue-on-error: true
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # The .nvmrc pin, except on the nightly run, which takes the newest 22.
          node-version: ${{ github.event_name == 'schedule' && '22' || '' }}
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: |
          # Run audit and capture results
          pnpm audit --audit-level=moderate --json > audit-results.json || true

          # Display human-readable results
          echo "=== Security Audit Results ==="
          pnpm audit --audit-level=moderate || echo "Vulnerabilities found - check details above"

          # Check for critical/high vulnerabilities
          CRITICAL=$(jq '[.advisories | to_entries[] | select(.value.severity == "critical")] | length' audit-results.json 2>/dev/null || echo "0")
          HIGH=$(jq '[.advisories | to_entries[] | select(.value.severity == "high")] | length' audit-results.json 2>/dev/null || echo "0")

          echo "Critical vulnerabilities: $CRITICAL"
          echo "High vulnerabilities: $HIGH"

          # Fail if critical vulnerabilities found
          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Critical vulnerabilities detected - build failed"
            exit 1
          fi

          # Warn on high vulnerabilities but don't fail
          if [ "$HIGH" -gt 0 ]; then
            echo "⚠️  High severity vulnerabilities detected - review recommended"
          fi

      - name: Verify lockfile integrity
        run: |
          # Ensure lockfile is in sync with package.json. pnpm 9 has no
          # `install --dry-run`. `--lockfile-only` resolves without touching
          # node_modules, and `--frozen-lockfile` fails if that would change it.
          pnpm install --frozen-lockfile --lockfile-only
          echo "✓ Lockfile integrity verified"

      - name: Check for known malicious packages
        run: |
          # Extract all dependencies
          echo "Checking dependencies for known malicious packages..."
          pnpm list --json --depth=Infinity > deps.json || true

          # Look for suspicious patterns (typosquatting, etc.)
          echo "Scanning for suspicious package names..."
          jq -r '.. | .dependencies? | select(.) | keys[]' deps.json 2>/dev/null | sort -u | while IFS= read -r pkg; do
            # Flag packages with suspicious patterns
            if echo "$pkg" | grep -qE '(^[0-9]+$|script|exec|eval)'; then
              echo "⚠️  Suspicious package name detected: $pkg"
            fi
          done
          echo "✓ Package name check complete"

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: security-audit-results
          path: |
            audit-results.json
            deps.json
          retention-days: 30

  # Package artifacts for signing (only on main branch pushes)
  package:
    name: Package Artifacts
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, test, lint]
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # The .nvmrc pin, except on the nightly run, which takes the newest 22.
          node-version: ${{ github.event_name == 'schedule' && '22' || '' }}
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Pack npm tarballs
        run: |
          mkdir -p dist-tarballs
          for pkg in packages/*/; do
            pkg_name=$(basename "$pkg")
            echo "Packing $pkg_name..."
            cd "$pkg"
            pnpm pack --pack-destination ../../dist-tarballs
            cd ../..
          done
          ls -la dist-tarballs/

      - name: Generate hashes for SLSA
        id: hash
        run: |
          cd dist-tarballs
          # Generate SHA256 hashes in base64 for SLSA provenance
          echo "hashes=$(sha256sum -- *.tgz | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages-${{ github.sha }}
          path: dist-tarballs/*.tgz
          retention-days: 30
          if-no-files-found: error

  # Sign packages with cosign (keyless via Sigstore)
  sign:
    name: Sign Packages (Cosign)
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write  # Required for keyless signing via OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: npm-packages-${{ github.sha }}
          path: dist-tarballs

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign packages with cosign (keyless)
        run: |
          cd dist-tarballs
          for tarball in *.tgz; do
            echo "Signing $tarball..."
            cosign sign-blob \
              --yes \
              --output-signature "${tarball}.sig" \
              --output-certificate "${tarball}.pem" \
              "$tarball"
          done
          ls -la

      - name: Verify signatures
        run: |
          cd dist-tarballs
          for tarball in *.tgz; do
            echo "Verifying $tarball..."
            cosign verify-blob \
              --signature "${tarball}.sig" \
              --certificate "${tarball}.pem" \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$tarball"
            echo "✓ $tarball signature verified"
          done

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages-signed-${{ github.sha }}
          path: |
            dist-tarballs/*.tgz
            dist-tarballs/*.sig
            dist-tarballs/*.pem
          retention-days: 90
          if-no-files-found: error

      - name: Generate signing summary
        run: |
          cd dist-tarballs
          {
            echo "## Cosign Signing Summary"
            echo ""
            echo "| Package | Signature | Certificate |"
            echo "|---------|-----------|-------------|"
            for tarball in *.tgz; do
              sig_hash=$(sha256sum "${tarball}.sig" | cut -d' ' -f1 | head -c 12)
              cert_hash=$(sha256sum "${tarball}.pem" | cut -d' ' -f1 | head -c 12)
              echo "| $tarball | ${sig_hash}... | ${cert_hash}... |"
            done
            echo ""
            echo "**Signing method:** Sigstore keyless (OIDC)"
            echo "**Transparency log:** Rekor"
          } >> "$GITHUB_STEP_SUMMARY"
