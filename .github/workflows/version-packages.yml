name: Version Packages

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: version-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Maintain version pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # `changeset version` exits 1 when there is nothing to version, so every
      # push without a pending changeset, the merge of a version PR included,
      # would fail this workflow. Nothing to version is not a failure.
      - name: Look for pending changesets
        id: pending
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "No pending changesets, so there is no version pull request to maintain."
          fi

      - name: Setup pnpm
        if: steps.pending.outputs.count != '0'
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.0.0

      - name: Setup Node.js
        if: steps.pending.outputs.count != '0'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.pending.outputs.count != '0'
        run: pnpm install --frozen-lockfile

      - name: Create or update Version Packages pull request
        if: steps.pending.outputs.count != '0'
        uses: changesets/action/version@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: pnpm release:version
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
