name: Dependency Review

# Note: This workflow requires GitHub's Dependency Graph API and cannot run locally with act

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail on critical and high vulnerabilities
          fail-on-severity: moderate
          # Allow only permissive licenses (denies GPL, LGPL, AGPL, etc.)
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0
          # Fail on packages with no license
          fail-on-scopes: runtime, development
          comment-summary-in-pr: always
          # Block known malicious packages
          vulnerability-check: true
          # Check for abandoned/deprecated packages
          warn-on-openssf-scorecard-level: 3
