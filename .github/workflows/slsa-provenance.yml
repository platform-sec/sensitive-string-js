name: SLSA Provenance

# Note: SLSA provenance generation requires GitHub's infrastructure and won't work in act
# The build job can run locally, but provenance generation uses reusable workflows

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build and generate hashes for SLSA provenance
  build:
    name: Build Packages
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      artifacts-sha256: ${{ steps.hash.outputs.artifacts-sha256 }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Pack npm tarballs
        run: |
          mkdir -p dist-tarballs
          for pkg in packages/*/; do
            pkg_name=$(basename "$pkg")
            echo "Packing $pkg_name..."
            cd "$pkg"
            pnpm pack --pack-destination ../../dist-tarballs
            cd ../..
          done
          ls -la dist-tarballs/

      - name: Generate subject hashes for SLSA
        id: hash
        run: |
          cd dist-tarballs
          # Generate SHA256 hashes in base64 for SLSA provenance
          HASHES=$(sha256sum -- *.tgz | base64 -w0)
          {
            echo "hashes=$HASHES"
            # Also output individual hashes for verification
            echo "artifacts-sha256<<EOF"
            sha256sum -- *.tgz
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        # Skip in act (local runner) - artifact upload requires GitHub infrastructure
        if: ${{ !env.ACT }}
        with:
          name: npm-packages-slsa
          path: dist-tarballs/*.tgz
          retention-days: 30
          if-no-files-found: error

  # Generate SLSA Level 3 provenance
  # Uses the official SLSA GitHub generator for maximum assurance
  provenance:
    name: Generate SLSA Provenance
    needs: build
    permissions:
      actions: read      # To read workflow path
      id-token: write    # To sign the provenance
      contents: write    # To upload provenance to release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true  # Upload to release if this is a release event
      # Provenance will be uploaded as an artifact with name: <artifact-name>.intoto.jsonl

  # Verify the generated provenance
  verify:
    name: Verify Provenance
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: npm-packages-slsa
          path: dist-tarballs

      - name: Download provenance
        uses: actions/download-artifact@v4
        with:
          name: multiple.intoto.jsonl
          path: provenance

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@3714a2a4684014deb874a0e737dffa0ee02dd647 # v2.6.0

      - name: Verify provenance
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          echo "=== Verifying SLSA Provenance ==="
          cd dist-tarballs
          for tarball in *.tgz; do
            echo "Verifying $tarball..."
            slsa-verifier verify-artifact \
              --provenance-path ../provenance/multiple.intoto.jsonl \
              --source-uri "github.com/$SOURCE_REPOSITORY" \
              --source-branch "$SOURCE_BRANCH" \
              "$tarball"
            echo "✓ $tarball provenance verified"
          done

      - name: Generate provenance summary
        env:
          ARTIFACT_HASHES: ${{ needs.build.outputs.artifacts-sha256 }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "## SLSA Provenance Summary"
            echo ""
            echo "**SLSA Level:** 3"
            echo "**Builder:** slsa-framework/slsa-github-generator"
            printf '**Repository:** %s\n' "$REPOSITORY"
            printf '**Commit:** %s\n' "$COMMIT_SHA"
            printf '**Branch/Tag:** %s\n' "$REF_NAME"
            echo ""
            echo "### Artifact Hashes (SHA256)"
            echo '```'
            printf '%s\n' "$ARTIFACT_HASHES"
            echo '```'
            echo ""
            echo "### Verification"
            echo "All artifacts verified against SLSA provenance ✓"
          } >> "$GITHUB_STEP_SUMMARY"

  # Attest build artifacts using GitHub's native attestation
  attest:
    name: Attest Build Artifacts
    needs: [build, provenance]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      id-token: write    # Required for attestation
      contents: read
      attestations: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: npm-packages-slsa
          path: dist-tarballs

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist-tarballs/*.tgz'

      - name: Generate attestation summary
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "## GitHub Attestation Summary"
            echo ""
            echo "Build provenance attestations generated for all packages."
            echo ""
            echo "**Attestations can be verified with:**"
            echo '```bash'
            printf 'gh attestation verify <artifact> --repo %s\n' "$REPOSITORY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Upload provenance and artifacts to release
  release-upload:
    name: Upload to Release
    needs: [build, provenance, verify]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: npm-packages-slsa
          path: dist-tarballs

      - name: Download provenance
        uses: actions/download-artifact@v4
        with:
          name: multiple.intoto.jsonl
          path: provenance

      - name: Generate checksums
        run: |
          cd dist-tarballs
          sha256sum -- *.tgz > SHA256SUMS.txt
          sha512sum -- *.tgz > SHA512SUMS.txt

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Upload tarballs, provenance, and checksums to the release
          gh release upload "$RELEASE_TAG" \
            dist-tarballs/*.tgz \
            dist-tarballs/SHA256SUMS.txt \
            dist-tarballs/SHA512SUMS.txt \
            provenance/multiple.intoto.jsonl \
            --clobber \
            --repo "$REPOSITORY"

          {
            echo "## Release Assets Uploaded"
            echo ""
            echo "The following files have been attached to the release:"
            echo "- npm package tarballs (*.tgz)"
            echo "- SHA256SUMS.txt"
            echo "- SHA512SUMS.txt"
            echo "- SLSA provenance (multiple.intoto.jsonl)"
          } >> "$GITHUB_STEP_SUMMARY"
