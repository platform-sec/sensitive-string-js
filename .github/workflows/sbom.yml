name: SBOM Generation

# Note: cyclonedx-npm has compatibility issues with pnpm workspaces in act
# The workflow works on GitHub Actions with proper npm/pnpm configuration

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-sbom:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate CycloneDX SBOM
        run: |
          # Install CycloneDX generator
          npm install -g @cyclonedx/cyclonedx-npm

          # Generate SBOM for each package
          for pkg in packages/*/; do
            pkg_name=$(basename "$pkg")
            echo "Generating SBOM for $pkg_name..."

            cd "$pkg"
            cyclonedx-npm \
              --output-format JSON \
              --output-file "../../sbom-${pkg_name}.json" \
              --omit dev

            cyclonedx-npm \
              --output-format XML \
              --output-file "../../sbom-${pkg_name}.xml" \
              --omit dev

            cd ../..
          done

          # Generate monorepo-wide SBOM
          cyclonedx-npm \
            --output-format JSON \
            --output-file sbom-full.json

          cyclonedx-npm \
            --output-format XML \
            --output-file sbom-full.xml

      - name: Generate SPDX SBOM
        run: |
          npm install -g @sbom-tool/spdx-sbom-generator

          # Generate SPDX format SBOM
          for pkg in packages/*/; do
            pkg_name=$(basename "$pkg")
            echo "Generating SPDX SBOM for $pkg_name..."
            spdx-sbom-generator -p "$pkg" -o "sbom-spdx-${pkg_name}.json" || echo "SPDX generation not available"
          done

      - name: Generate dependency tree
        run: |
          {
            echo "=== Full Dependency Tree ==="
            pnpm list --depth=Infinity
            printf '\n\n=== Production Dependencies Only ===\n'
            pnpm list --prod --depth=Infinity
          } > dependency-tree.txt

      - name: Calculate checksums
        run: |
          echo "Calculating SBOM checksums..."
          sha256sum -- sbom-*.json sbom-*.xml > sbom-checksums.txt
          sha512sum -- sbom-*.json sbom-*.xml >> sbom-checksums.txt

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        # Skip in act (local runner) - artifact upload requires GitHub infrastructure
        if: ${{ !env.ACT }}
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom-*.json
            sbom-*.xml
            sbom-checksums.txt
            dependency-tree.txt
          retention-days: 90

      - name: Attest SBOM for releases
        if: github.event_name == 'release'
        uses: actions/attest-sbom@v1
        with:
          subject-path: 'sbom-*.json'
          sbom-path: 'sbom-full.json'

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Attach SBOMs to the release
          gh release upload "$RELEASE_TAG" \
            sbom-*.json \
            sbom-*.xml \
            sbom-checksums.txt \
            --clobber

  verify-sbom:
    name: Verify SBOM Quality
    needs: generate-sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@v4
        # Skip in act (local runner) - artifacts not available
        if: ${{ !env.ACT }}
        continue-on-error: true
        with:
          name: sbom-${{ github.sha }}

      - name: Validate CycloneDX SBOM
        run: |
          npm install -g @cyclonedx/cyclonedx-cli

          # Validate each SBOM file
          for sbom in sbom-*.json; do
            if [ -f "$sbom" ]; then
              echo "Validating $sbom..."
              cyclonedx validate --input-file "$sbom" --fail-on-errors || echo "⚠️  Validation warnings for $sbom"
            fi
          done

      - name: Analyze SBOM completeness
        run: |
          # Check that SBOM contains expected components
          for sbom in sbom-*.json; do
            if [ -f "$sbom" ]; then
              echo "Analyzing $sbom..."

              # Count components
              COMPONENTS=$(jq '.components | length' "$sbom" 2>/dev/null || echo "0")
              echo "  Components: $COMPONENTS"

              # Check for vulnerabilities field
              HAS_VULNS=$(jq 'has("vulnerabilities")' "$sbom" 2>/dev/null || echo "false")
              echo "  Vulnerabilities data: $HAS_VULNS"

              # Verify required fields
              HAS_METADATA=$(jq 'has("metadata")' "$sbom" 2>/dev/null || echo "false")
              echo "  Metadata present: $HAS_METADATA"

              if [ "$COMPONENTS" -eq 0 ]; then
                echo "⚠️  Warning: SBOM contains no components"
              fi
            fi
          done
