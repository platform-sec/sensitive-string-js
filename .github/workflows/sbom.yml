name: SBOM Generation

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-sbom:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CycloneDX CLI
        env:
          CYCLONEDX_CLI_SHA256: bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746
          CYCLONEDX_CLI_VERSION: 0.33.1
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/cyclonedx" \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v${CYCLONEDX_CLI_VERSION}/cyclonedx-linux-x64"
          echo "${CYCLONEDX_CLI_SHA256}  $RUNNER_TEMP/cyclonedx" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cyclonedx"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Generate CycloneDX SBOM
        run: |
          # pnpm 11 provides the package-manager-native generator. Run it through
          # pnpm 9 so dependency installation remains pinned to this repository's
          # packageManager version.
          for pkg in packages/*/; do
            pkg_name=$(basename "$pkg")
            echo "Generating SBOM for $pkg_name..."

            pnpm dlx pnpm@11.25.0 --pm-on-fail=ignore sbom \
              --filter "./${pkg%/}" \
              --fail-if-no-match \
              --prod \
              --sbom-format cyclonedx \
              --sbom-spec-version 1.6 \
              --out "sbom-${pkg_name}.json"

            cyclonedx convert \
              --input-file "sbom-${pkg_name}.json" \
              --input-format json \
              --output-file "sbom-${pkg_name}.xml" \
              --output-format xml \
              --output-version v1_6
          done

          # Generate monorepo-wide SBOM
          pnpm dlx pnpm@11.25.0 --pm-on-fail=ignore sbom \
            --filter './packages/*' \
            --fail-if-no-match \
            --sbom-format cyclonedx \
            --sbom-spec-version 1.6 \
            --out sbom-full.json

          cyclonedx convert \
            --input-file sbom-full.json \
            --input-format json \
            --output-file sbom-full.xml \
            --output-format xml \
            --output-version v1_6

      - name: Generate SPDX SBOM
        run: |
          for pkg in packages/*/; do
            pkg_name=$(basename "$pkg")
            echo "Generating SPDX SBOM for $pkg_name..."

            pnpm dlx pnpm@11.25.0 --pm-on-fail=ignore sbom \
              --filter "./${pkg%/}" \
              --fail-if-no-match \
              --prod \
              --sbom-format spdx \
              --out "sbom-spdx-${pkg_name}.json"
          done

      - name: Verify generated SBOM set
        run: |
          package_count=$(find packages -mindepth 2 -maxdepth 2 -type f -name package.json | wc -l)
          cyclonedx_json_count=$(find . -maxdepth 1 -type f -name 'sbom-*.json' ! -name 'sbom-spdx-*' | wc -l)
          cyclonedx_xml_count=$(find . -maxdepth 1 -type f -name 'sbom-*.xml' | wc -l)
          spdx_json_count=$(find . -maxdepth 1 -type f -name 'sbom-spdx-*.json' | wc -l)

          echo "Packages: $package_count"
          echo "CycloneDX JSON files: $cyclonedx_json_count"
          echo "CycloneDX XML files: $cyclonedx_xml_count"
          echo "SPDX JSON files: $spdx_json_count"

          test "$cyclonedx_json_count" -eq "$((package_count + 1))"
          test "$cyclonedx_xml_count" -eq "$((package_count + 1))"
          test "$spdx_json_count" -eq "$package_count"

      - name: Generate dependency tree
        run: |
          {
            echo "=== Full Dependency Tree ==="
            pnpm list --depth=Infinity
            printf '\n\n=== Production Dependencies Only ===\n'
            pnpm list --prod --depth=Infinity
          } > dependency-tree.txt

      - name: Calculate checksums
        run: |
          echo "Calculating SBOM checksums..."
          sha256sum -- sbom-*.json sbom-*.xml > sbom-checksums.txt
          sha512sum -- sbom-*.json sbom-*.xml >> sbom-checksums.txt

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        # Skip in act (local runner) - artifact upload requires GitHub infrastructure
        if: ${{ !env.ACT }}
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom-*.json
            sbom-*.xml
            sbom-checksums.txt
            dependency-tree.txt
          retention-days: 90

      - name: Attest SBOM for releases
        if: github.event_name == 'release'
        uses: actions/attest-sbom@v1
        with:
          subject-path: 'sbom-*.json'
          sbom-path: 'sbom-full.json'

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Attach SBOMs to the release
          gh release upload "$RELEASE_TAG" \
            sbom-*.json \
            sbom-*.xml \
            sbom-checksums.txt \
            --clobber

  verify-sbom:
    name: Verify SBOM Quality
    needs: generate-sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@v4
        # Skip in act (local runner) - artifacts not available
        if: ${{ !env.ACT }}
        with:
          name: sbom-${{ github.sha }}

      - name: Validate CycloneDX SBOM
        run: |
          CYCLONEDX_CLI_VERSION=0.33.1
          CYCLONEDX_CLI_SHA256=bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746

          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/cyclonedx" \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v${CYCLONEDX_CLI_VERSION}/cyclonedx-linux-x64"
          echo "${CYCLONEDX_CLI_SHA256}  $RUNNER_TEMP/cyclonedx" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cyclonedx"

          # This CLI validates CycloneDX, so exclude the SPDX JSON artifacts.
          for sbom in sbom-*.json sbom-*.xml; do
            if [ -f "$sbom" ]; then
              case "$sbom" in
                sbom-spdx-*) continue ;;
              esac

              echo "Validating $sbom..."
              "$RUNNER_TEMP/cyclonedx" validate --input-file "$sbom" --fail-on-errors
            fi
          done

      - name: Analyze SBOM completeness
        run: |
          # Check that SBOM contains expected components
          for sbom in sbom-*.json; do
            if [ -f "$sbom" ]; then
              case "$sbom" in
                sbom-spdx-*) continue ;;
              esac

              echo "Analyzing $sbom..."

              # Count components
              COMPONENTS=$(jq '.components | length' "$sbom" 2>/dev/null || echo "0")
              echo "  Components: $COMPONENTS"

              # Check for vulnerabilities field
              HAS_VULNS=$(jq 'has("vulnerabilities")' "$sbom" 2>/dev/null || echo "false")
              echo "  Vulnerabilities data: $HAS_VULNS"

              # Verify required fields
              HAS_METADATA=$(jq 'has("metadata")' "$sbom" 2>/dev/null || echo "false")
              echo "  Metadata present: $HAS_METADATA"

              if [ "$COMPONENTS" -eq 0 ]; then
                echo "⚠️  Warning: SBOM contains no components"
              fi
            fi
          done
